[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["dev@theradius.xyz", "raf@theradius.xyz"]
homepage = "https://theradius.xyz"
repository = "https://github.com/radiusxyz/secure-rpc-provider"

[workspace]
resolver = "2"
members = ["src", "cli", "node/*", "rpc", "primitives"]
default-members = ["src"]

[workspace.dependencies]

secure-rpc-cli = { path = "cli" }
secure-rpc-service = { path = "rpc" }
secure-rpc-node-service = { path = "node/service" }
secure-rpc-node-primitive = { path = "node/primitive" }
secure-rpc-primitives = { path = "primitives" }

# External
clap = { version = "4.4.7", features = ["derive"] }
rand = "0.8.5"
reqwest = { version = "0.12.4", features = ["json"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1.37.0", features = ["full"] }
toml = "0.8.13"
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
thiserror = "2.0.12"
anyhow = "1.0.97"
async-trait = "0.1.88"
alloy = "0.7"
jsonrpsee = { version = "0.25.1", features = ["client", "macros"] }
futures = "0.3.31"

# Radius
skde = { git = "https://github.com/radiusxyz/skde", rev = "69e70ac0ab071000b3d13557cdbed43ffeddc878" }
tx_orderer = { git = "https://github.com/radiusxyz/tx_orderer", rev = "6f07f091a0559a088195e89f97a74036273e3a41" }
radius-sdk = { git = "https://github.com/radiusxyz/radius-sdk-rs", rev = "adc39b020a876a0325b977c295bda1b10175720a", features = [
    "full",
] }
